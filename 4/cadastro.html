<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>


<form>
    Login: <br>
    <input type="text" required name="login"><br>

    Senha: <br>
    <input type="password" name="senha"><br>
    Confirmar Senha : <br>
    <input type="password" name="confirmarsenha"><br>

    Nome : <br>
    <input type="text" name="nome"><br>
    
    Sexo : <br>
    <input type="radio" value="Masculino" name="sexo"> Masculino<br>
    <input type="radio" value="Feminino" name="sexo">Feminino<br>

    Email : <br>
    <input type="email" name="email"><br><br>

    Interesses : <br>
    <input type="checkbox" value="Dinheiro" name="interesses">Dinheiro<br>
    <input type="checkbox" value="Bale"name="interesses"> Balé<br>
    <input type="checkbox" value="Carros esportivos" name="interesses"> Carros esportivos <br>
    <input type="checkbox" value="Apartamentos" name="interesses">Apartamentos<br>
    <input type="checkbox" value="Dança" name="interesses"> Dança<br>
    <input type="checkbox" value="Relacionamentos" name="interesses"> Relacionamentos<br>

    <label for="estado">Estado (UF): </label>

    <select id="estado" name="estado" required>
    <option value="" disabled selected>Selecione um estado</option>
    <option value="MA">Maranhão</option>
    <option value="PI">Piauí</option>
    <option value="GO">Goiás</option>
   
    <div class="grupo-campo">
        <label for="observações">Observações:</label>
        <textarea
        id="observaçoes"
        name="obervaçoes"
        rows="5"
        cols="50"
        placeholder="Digite suas obervaçoes ou comentarios adicionais"
        maxlength="500"></textarea>
    </div>

    <input type="button" value="Enviar">
    

    </select>
</form>
